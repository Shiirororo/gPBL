services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gpbl_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Required for Judge Engine to spawn isolated execution containers
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    container_name: gpbl_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
